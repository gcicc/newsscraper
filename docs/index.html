:root[data-theme="light"] {

.bar {

}

.s-fresh { color: var(--go); } .s-stale { color: var(--warn); } .s-failed { color: var(--hold); }

.bar nav a { color: var(--ink-2); }

.filterbar {

}
#q {

}

.n { font: 500 0.75rem var(--mono); color: var(--ink-muted); white-space: nowrap; }

main { padding: 1rem var(--gutter) 2rem; }
.cols { display: grid; grid-template-columns: 1fr; gap: 1.25rem; align-items: start; }
@media (min-width: 1000px) { .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.src { background: var(--strip); border: 1px solid var(--rule); border-top: 2px solid var(--accent);
  border-radius: 3px; padding: 0.75rem 0.9rem; min-width: 0; }
.src.wide { margin-top: 1.25rem; }
.src h2 { font: 700 1.05rem var(--display); margin: 0; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.75rem; }

.note { font-size: 0.8rem; margin: 0.4rem 0 0; padding: 0.35rem 0.5rem; border-left: 3px solid currentColor; }
.note.s-stale { color: var(--warn); } .note.s-failed { color: var(--hold); }

ol.list { list-style: none; margin: 0.5rem 0 0; padding: 0; }
ol.list li { padding: 0.45rem 0; border-top: 1px solid var(--rule); }
ol.list li:first-child { border-top: 0; }
ol.list a { font-weight: 500; }
.meta { display: block; font: 400 0.7rem var(--mono); color: var(--ink-muted); margin-top: 0.1rem; }
.empty { color: var(--ink-muted); font-size: 0.85rem; margin: 0.6rem 0 0; }

.tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0 0.2rem; }
.tabs button {

.tabs button[aria-selected="true"] { color: var(--ink); background: var(--strip-hot); border-color: var(--accent); }

#categories ol.list { column-width: 22rem; column-gap: 2rem; }
#categories ol.list li { break-inside: avoid; }

.foot { padding: 1rem var(--gutter) 2rem; color: var(--ink-muted); font: 400 0.75rem var(--mono); }

":"technology","p":"2026-11-16T12:53:18+00:00","s":"BleepingComputer","t":"Microsoft: Windows Server 2016 reaches end of support in 60 days","u":"https://news.google.com/rss/articles/CBMisgFBVV95cUxQdXFEZkl2d053WWJ3WjU5TWU5WV84SmY0dWNxN1c2d2FIYXpPUGNkbjM1c2QyU0ZoelhCaHF6WHhCako4eWlCVVNlbXJHMnpKMVV6aFlfM25Ecnl1bzIwVGtYZDBUdVg3cmo5YnA4X2hpbkszUnNucGtkTmtHMnNIdjJZOGllcHlZeU5vYTMwdkF6YjVUVVpWZU9VT1VpTXl2aXJ3ZlBLWEVueDExMzIzSEtB0gG3AUFVX3lxTFBwUkljR01wNFpwelpnSFpGLVJrMW91YWYtQkhsVHJObHU2R1UyandFYzlydXlyNWVqdXdwVkdGdWpObzVuUEdZZk1LaGh0bW1Ca2R4MV9admNsMmRmdTh6TEotaXdRcXVybUJncHlBMWI1WlJBNmNGMlFodlZub05vcllnVkVDMHJoMFktUWFtb010MkFVTXdzbHhfazljWWxxZm9FWFgzTjI0dVpaVXJKWWtBZ3dwVQ?oc=5"},{"f":"technology","p":"2026-11-17T13:00:00+00:00","s":"Nintendo Life","t":"Review: TANUKI: Pon's Summer (Switch 2) - Cosy Postie Delivers Sick BMX Tricks & Minigames","u":"https://news.google.com/rss/articles/CBMifkFVX3lxTE5JQ0F5UWJCLTJibC1NYWNkejd6YVZKTkR6T3BQdmdEN01VNFhtMlo5ODNlZ2FZWW0xaF9NVjdjSzM3b3R6UE1zSm1pSUJLbEdqZXFnSFIyRjg3VGpqeVFKQVppT1JocFZIN2Ziam50UEthRDRWdFhCVzlZNXIyUQ?oc=5"},{"f":"technology","p":"2026-11-16T17:51:27+00:00","s":"MacRumors","t":"Some OLED MacBook Pro Owners Report Eye Strain and Dizziness","u":"https://news.google.com/rss/articles/CBMihgFBVV95cUxPQktaR2ZBSnVwcHZ0SFB3TVNGV1NHQmx0ZVd0WV9meWRuSS1jNTVaRThZNEVGWVRId0QzUnltb0hFWnNhbFZ3Z2p1OENydzlRRFB6cE1RMnpTblNHM3NtMnJQS3AzZ3ZSRFRVb3U1Uzh0dG94M1N6Rm10SWVBM1VKclRWT29FUQ?oc=5"},{"f":"technology","p":"2026-11-17T09:17:20+00:00","s":"Eurogamer.net","t":"EA really doesn't want you to delete Madden NFL 27 to make room for GTA 6","u":"https://news.google.com/rss/articles/CBMibEFVX3lxTE1JRjc2X2VOT1ZRSWNwQ21XVnJ1MnppSVRyNXc0Y2NfTzJ5YXpZODNDT1JGUmVMRllOemR3dnltU2kxTVZrVzNTeDd6eW5kNWY5WlBYVW9wYklfS19HY092bVdqelBNaVNVdnhvSA?oc=5"}]}},"status":{"drudge":{"state":"fresh","fetched_at":"2026-11-18T09:49:27+00:00","age":"6s","last_error":null,"last_error_at":null},"fox":{"state":"fresh","fetched_at":"2026-11-18T09:49:29+00:00","age":"4s","last_error":null,"last_error_at":null},"cnbc":{"state":"fresh","fetched_at":"2026-11-18T09:49:31+00:00","age":"2s","last_error":null,"last_error_at":null},"categories":{"state":"fresh","fetched_at":"2026-11-18T09:49:33+00:00","age":"0s","last_error":null,"last_error_at":null}}}</script>
<script>/* Wire page script. Reads the inlined payload; makes no network requests.
   Headline text is always inserted with textContent, never as HTML. */
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("payload").textContent);
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- relative ages ---------- */
  function ago(iso) {
    if (!iso) { return ""; }
    var t = Date.parse(iso);
    if (isNaN(t)) { return ""; }
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) { return "just now"; }
    if (s < 3600) { return Math.floor(s / 60) + "m ago"; }
    if (s < 86400) { return Math.floor(s / 3600) + "h ago"; }
    return Math.floor(s / 86400) + "d ago";
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text != null) { n.textContent = text; }
    return n;
  }

  /* ---------- status ---------- */
  var NAMES = { drudge: "Drudge", fox: "Fox", cnbc: "CNBC", categories: "Categories" };
  function statusNote(key) {
    var s = D.status[key] || { state: "stale" };
    var when = s.fetched_at ? ago(s.fetched_at) : "";
    if (s.state === "failed") {
      return { cls: "s-failed", text: "Last refresh failed" + (s.last_error_at ? " (" + ago(s.last_error_at) + ")" : "") +
        ". Showing the previous copy" + (when ? " from " + when : "") + ". " + (s.last_error || "") };
    }
    if (s.state === "stale") {
      return { cls: "s-stale", text: s.fetched_at ? "Stale: this copy is from " + when + "." : "No data fetched yet." };
    }
    return null;
  }
  function partialNote(failed) {
    var names = Object.keys(failed || {});
    if (!names.length) { return null; }
    return { cls: "s-stale", text: "Partial: " + names.join(", ") + (names.length > 1 ? " feeds" : " feed") +
      " failed this refresh; those items are from the previous copy." };
  }

  function buildBus() {
    var bus = $("bus");
    Object.keys(NAMES).forEach(function (k) {
      var s = D.status[k] || { state: "stale" };
      var c = el("span", "chip s-" + s.state);
      c.appendChild(el("span", "nm", NAMES[k] + " " + s.state));
      c.title = NAMES[k] + ": " + s.state + (s.fetched_at ? ", fetched " + s.fetched_at.replace("T", " ").replace("+00:00", "") + " UTC (" + ago(s.fetched_at) + ")" : "") +
        (s.last_error ? ". Error: " + s.last_error : "");
      bus.appendChild(c);
    });
  }

  /* ---------- lists ---------- */
  function row(it, showFeed) {
    var li = el("li");
    var a = el("a", null, it.t);
    a.href = it.u;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    li.appendChild(a);
    var bits = [];
    if (showFeed && it.f) { bits.push(it.f); }
    if (it.s) { bits.push(it.s); }
    var age = ago(it.p);
    if (age) { bits.push(age); }
    if (bits.length) { li.appendChild(el("span", "meta", bits.join(" · "))); }
    li.setAttribute("data-q", (it.t + " " + (it.s || "") + " " + (it.f || "")).toLowerCase());
    return li;
  }

  var lists = []; /* {ol, total, countEl, emptyEl} */

  function fill(ol, items, showFeed) {
    ol.textContent = "";
    var frag = document.createDocumentFragment();
    items.forEach(function (it) { frag.appendChild(row(it, showFeed)); });
    ol.appendChild(frag);
  }

  function section(key, title, items, failed, showFeed) {
    var host = $(key);
    var head = el("div", "head");
    head.appendChild(el("h2", null, title));
    var count = el("span", "n");
    head.appendChild(count);
    var s = D.status[key];
    if (s && s.fetched_at) { head.appendChild(el("span", "stamp", "fetched " + ago(s.fetched_at))); }
    host.appendChild(head);
    [statusNote(key), partialNote(failed)].forEach(function (n) {
      if (n) { host.appendChild(el("p", "note " + n.cls, n.text)); }
    });
    var ol = el("ol", "list");
    var empty = el("p", "empty");
    empty.hidden = true;
    host.appendChild(ol);
    host.appendChild(empty);
    fill(ol, items, showFeed);
    if (!items.length) { empty.hidden = false; empty.textContent = "No headlines yet."; }
    return { ol: ol, total: items.length, countEl: count, emptyEl: empty, none: !items.length };
  }

  /* ---------- filter ---------- */
  function applyFilter() {
    var q = $("q").value.trim().toLowerCase();
    var terms = q ? q.split(/\s+/) : [];
    var shown = 0, all = 0;
    lists.forEach(function (L) {
      var n = 0;
      Array.prototype.forEach.call(L.ol.children, function (li) {
        var hay = li.getAttribute("data-q");
        var ok = terms.every(function (t) { return hay.indexOf(t) !== -1; });
        li.hidden = !ok;
        if (ok) { n++; }
      });
      L.countEl.textContent = (terms.length ? n + " of " : "") + L.total;
      if (!L.none) {
        L.emptyEl.hidden = n > 0;
        L.emptyEl.textContent = "No headlines match.";
      }
      shown += n; all += L.total;
    });
    $("q-n").textContent = terms.length ? shown + " of " + all + " shown" : all + " headlines";
  }

  /* ---------- categories ---------- */
  function buildCategories() {
    var host = $("categories");
    var C = D.categories;
    var keys = Object.keys(C.labels);
    var saved = null;
    try { saved = localStorage.getItem("wire-category"); } catch (e) { /* ignore */ }
    var active = keys.indexOf(saved) !== -1 ? saved : keys[0];

    var head = el("div", "head");
    head.appendChild(el("h2", null, "By category"));
    var count = el("span", "n");
    head.appendChild(count);
    var s = D.status.categories;
    if (s && s.fetched_at) { head.appendChild(el("span", "stamp", "fetched " + ago(s.fetched_at))); }
    host.appendChild(head);
    [statusNote("categories"), partialNote(C.failed_feeds)].forEach(function (n) {
      if (n) { host.appendChild(el("p", "note " + n.cls, n.text)); }
    });
    var tabs = el("div", "tabs");
    tabs.setAttribute("role", "tablist");
    host.appendChild(tabs);
    var ol = el("ol", "list");
    var empty = el("p", "empty");
    empty.hidden = true;
    host.appendChild(ol);
    host.appendChild(empty);

    var L = { ol: ol, total: 0, countEl: count, emptyEl: empty, none: false };
    lists.push(L);

    function show(k) {
      active = k;
      try { localStorage.setItem("wire-category", k); } catch (e) { /* ignore */ }
      Array.prototype.forEach.call(tabs.children, function (b) {
        b.setAttribute("aria-selected", b.getAttribute("data-k") === k ? "true" : "false");
      });
      var items = C.items[k] || [];
      fill(ol, items, false);
      L.total = items.length;
      L.none = !items.length;
      empty.hidden = !!items.length;
      if (!items.length) { empty.textContent = "No headlines in this category yet."; }
      applyFilter();
    }
    keys.forEach(function (k) {
      var b = el("button", null, C.labels[k] + " (" + (C.items[k] || []).length + ")");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("data-k", k);
      b.addEventListener("click", function () { show(k); });
      tabs.appendChild(b);
    });
    show(active);
  }

  /* ---------- theme ---------- */
  function initTheme() {
    var btn = $("theme");
    function apply(mode) {
      document.documentElement.setAttribute("data-theme", mode);
      btn.textContent = mode === "dark" ? "Light" : "Dark";
      try { localStorage.setItem("wire-theme", mode); } catch (e) { /* private mode */ }
    }
    btn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "Light" : "Dark";
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      apply(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
  }

  /* ---------- boot ---------- */
  buildBus();
  ["drudge", "fox", "cnbc"].forEach(function (k) {
    var src = D.sources[k];
    lists.push(section(k, src.label, src.items || [], src.failed_feeds, true));
  });
  buildCategories();
  $("q").addEventListener("input", applyFilter);
  initTheme();
  applyFilter();
})();
</script>
