[project]
name = "wire"
version = "0.1.0"
description = "Wire - every headline from Drudge, Fox and CNBC plus by-category headlines, minus the ads"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["wire"]
